<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#070B16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Cyan Electric Glow -->
    <radialGradient id="cyanCoreGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Safety Shield Glow -->
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0" />
    </radialGradient>

    <!-- Roof Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Shield Arc Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Energy Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#7DD3FC" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- House Glass Gradient -->
    <linearGradient id="houseGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070B16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Text Gradient for IQ -->
    <linearGradient id="iqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)" />
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="#1E293B" stroke-width="3" opacity="0.6" />

  <!-- Ambient Light Halos -->
  <circle cx="512" cy="420" r="340" fill="url(#cyanCoreGlow)" />
  <circle cx="512" cy="440" r="280" fill="url(#shieldGlow)" />

  <!-- Outer Orbital Guardian Ring (Family Safety Arch) -->
  <path d="M 280 490 A 260 260 0 1 1 744 490" fill="none" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 14" opacity="0.45" />
  <path d="M 330 450 A 210 210 0 1 1 694 450" fill="none" stroke="url(#roofGrad)" stroke-width="4" stroke-linecap="round" opacity="0.3" />

  <!-- Orbiting Safety & Eco Nodes -->
  <circle cx="280" cy="490" r="9" fill="#10B981" filter="url(#neonGlowEmerald)" />
  <circle cx="744" cy="490" r="9" fill="#38BDF8" filter="url(#neonGlowCyan)" />
  <circle cx="512" cy="180" r="11" fill="#38BDF8" filter="url(#neonGlowCyan)" />

  <!-- Main House Structure Container -->
  <g filter="url(#dropShadow)">
    <!-- House Body Base (Frosted Dark Glass) -->
    <path d="M 512 210 
             L 760 395 
             L 760 640 
             A 28 28 0 0 1 732 668 
             L 292 668 
             A 28 28 0 0 1 264 640 
             L 264 395 Z" 
          fill="url(#houseGlass)" 
          stroke="#334155" 
          stroke-width="5" />

    <!-- Sleek Neon Roof Gables (Cyan Electric Accent) -->
    <path d="M 240 405 L 512 202 L 784 405" 
          fill="none" 
          stroke="url(#roofGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlowCyan)" />

    <!-- Subtle Inner Roof Border -->
    <path d="M 272 402 L 512 222 L 752 402" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.5" />

    <!-- Circuit Trace Lines from Roof to Core (Smart Grid) -->
    <path d="M 512 260 L 512 320" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <circle cx="512" cy="260" r="5" fill="#38BDF8" />
    <path d="M 430 310 L 470 340 L 470 380" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <circle cx="430" cy="310" r="4" fill="#38BDF8" opacity="0.6" />
    <path d="M 594 310 L 554 340 L 554 380" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <circle cx="594" cy="310" r="4" fill="#10B981" opacity="0.6" />

    <!-- Safety Guardian Crest / Shield Base (Subtle) -->
    <path d="M 512 330 
             L 630 385 
             L 630 495 
             C 630 565 575 615 512 635 
             C 449 615 394 565 394 495 
             L 394 385 Z" 
          fill="#0B132B" 
          fill-opacity="0.75" 
          stroke="url(#shieldGrad)" 
          stroke-width="4" 
          filter="url(#neonGlowEmerald)" />

    <!-- Central Glowing Energy Lightning Bolt (The Heart of HomeIQ) -->
    <!-- Outer Glow Silhouette -->
    <polygon points="536,360 440,480 508,480 472,610 592,460 520,460" 
             fill="url(#boltGrad)" 
             filter="url(#neonGlowCyan)" />

    <!-- Crisp White Core Lightning -->
    <polygon points="534,365 448,476 512,476 480,596 582,464 522,464" 
             fill="#FFFFFF" 
             opacity="0.95" />
  </g>

  <!-- Typography: HomeIQ Branding -->
  <g id="brandText" filter="url(#dropShadow)">
    <!-- "Home" in Crisp Snow White -->
    <text x="345" y="775" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Montserrat', 'Inter', sans-serif" 
          font-weight="800" 
          font-size="82" 
          letter-spacing="-1.5" 
          fill="#F8FAFC">Home</text>

    <!-- "IQ" in Glowing Cyan-to-Emerald Gradient -->
    <text x="575" y="775" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Montserrat', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="82" 
          letter-spacing="-0.5" 
          fill="url(#iqGrad)" 
          filter="url(#neonGlowCyan)">IQ</text>

    <!-- Dynamic AI Sparkle Badge next to IQ -->
    <path d="M 698 718 Q 706 726 714 726 Q 706 726 698 734 Q 698 726 690 726 Q 698 726 698 718 Z" 
          fill="#38BDF8" 
          filter="url(#neonGlowCyan)" />

    <!-- Elegant Subtitle Badge -->
    <text x="512" y="828" 
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" 
          font-weight="600" 
          font-size="20" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#94A3B8">AI ENERGY &amp; FAMILY GUARDIAN</text>

    <!-- Fire TV & Alexa Sub-pill -->
    <g transform="translate(362, 856)">
      <rect width="300" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="150" y="23" 
            font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" 
            font-weight="600" 
            font-size="13" 
            letter-spacing="2" 
            text-anchor="middle" 
            fill="#38BDF8">AMAZON FIRE TV  •  ALEXA</text>
    </g>
  </g>
</svg>
